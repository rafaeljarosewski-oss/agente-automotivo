name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint, typecheck e testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

  banco-e2e:
    name: Testes de banco (RLS) e ponta a ponta
    runs-on: ubuntu-latest
    needs: qualidade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Subir Supabase local
        run: npm run db:start
      - name: Gerar .env.local
        run: |
          STATUS=$(npx supabase status -o json | sed -n '/^{/,$p')
          {
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$STATUS" | jq -r .API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(echo "$STATUS" | jq -r .PUBLISHABLE_KEY)"
            echo "SUPABASE_SECRET_KEY=$(echo "$STATUS" | jq -r .SECRET_KEY)"
            echo "APP_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "CRON_SECRET=$(openssl rand -hex 24)"
            echo "FISCAL_PROVIDER=mock"
            echo "FISCAL_WEBHOOK_SECRET=$(openssl rand -hex 24)"
          } > .env.local
      - name: Testes de banco (isolamento multiempresa)
        run: npm run test:db
      - name: Seed de demonstração
        run: npm run db:seed
      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Testes ponta a ponta
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
